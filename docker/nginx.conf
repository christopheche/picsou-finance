# Preserve the X-Forwarded-* values an upstream TLS terminator (Caddy, Traefik, NPM,
# Cloudflare Tunnel, …) sent, falling back to this nginx's own values only when it is
# the edge. The backend honors these (server.forward-headers-strategy=framework) so a
# same-origin HTTPS request is recognized as same-origin and not wrongly rejected by CORS.
# Port/host fall through to empty when the upstream sent nothing — nginx then omits the
# header and the backend derives the port from the scheme (443 for https, 80 for http).
map $http_x_forwarded_proto $picsou_xfp   { default $scheme; ~.+ $http_x_forwarded_proto; }
map $http_x_forwarded_host  $picsou_xfh   { default "";      ~.+ $http_x_forwarded_host;  }
map $http_x_forwarded_port  $picsou_xfport { default "";     ~.+ $http_x_forwarded_port;  }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend (internal port 9090)
    location /api {
        # Match spring.servlet.multipart.max-request-size (10MB, application.yml)
        # so multi-year CSV/XLSX imports are not cut off by nginx's 1m default
        # with an HTML 413 before they reach the backend.
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:9090;
        # The backend gates its own Strict-Transport-Security on the same
        # HSTS_ENABLED flag (SecurityConfig), which is what the split-stack
        # deployment relies on. Here it would arrive alongside this server
        # block's own add_header, so the response would carry the header twice.
        # Hide the upstream copy and let the nginx-level gate be authoritative.
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
        # Some sync flows (Enable Banking, Trade Republic) wait on third-party
        # APIs. The backend caps its own waits, but give nginx breathing room
        # so a slightly slow upstream doesn't surface as a blank 502 page.
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy actuator health checks to backend
    location /actuator {
        proxy_pass http://127.0.0.1:9090;
        proxy_hide_header Strict-Transport-Security;   # see /api block
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $picsou_xfp;
        proxy_set_header X-Forwarded-Host  $picsou_xfh;
        proxy_set_header X-Forwarded-Port  $picsou_xfport;
    }

    # Vite's build output lives under /assets/ with a content hash in every
    # filename, so it is safe to cache for a year and mark immutable. Only
    # this path gets that policy — the `^~` prefix match takes precedence over
    # the regex block below.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Defining add_header in this block drops the server-level security headers
        # (nginx add_header inheritance), so re-declare them here — otherwise .js/.css
        # would be served without nosniff/CSP/etc. Keep in sync with the server block.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/picsou-hsts.conf;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Files copied verbatim from frontend/public/ keep their name across
    # releases (theme-init.js loaded by index.html, favicon.svg, /fonts,
    # provider/wallet/exchange logos). Never mark those immutable: a browser
    # would keep the old copy for a year and `immutable` skips revalidation
    # even on reload. `no-cache` still allows caching but forces a conditional
    # request each time — a cheap 304 when nothing changed.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache";
        # Defining add_header in this block drops the server-level security headers
        # (nginx add_header inheritance), so re-declare them here — otherwise .js/.css
        # would be served without nosniff/CSP/etc. Keep in sync with the server block.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/picsou-hsts.conf;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # font-src 'self' covers the Homemade Apple woff2 self-hosted under /fonts/.
    # No third-party font CDN is allowed — part of the zero-phone-home posture.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    # HSTS is opt-in (HSTS_ENABLED) — the snippet is written at boot by
    # entrypoint.sh and is empty by default. Rationale: Picsou is commonly
    # served with a locally-issued certificate (Caddy's internal CA via the
    # `tls` compose profile, or mkcert), and HSTS + an untrusted cert is a
    # one-way trap — the browser drops the "proceed anyway" bypass and the
    # user is locked out of the app with no in-app recovery.
    include /etc/nginx/snippets/picsou-hsts.conf;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
