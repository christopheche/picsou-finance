name: CI

# Third-party actions are pinned to full commit SHAs (version in the trailing
# comment) so a moved or compromised tag cannot change what runs here.
# .github/dependabot.yml keeps the pins fresh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        # Migration tests skip themselves when Docker is unreachable so local runs
        # without a socket still work. Runners always have Docker, so require it here --
        # otherwise environment drift would silently drop the PostgreSQL coverage of
        # data-mutating migrations and the build would stay green.
        env:
          PICSOU_REQUIRE_DOCKER_TESTS: 'true'
        run: mvn -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Lint
        run: bun run lint
        working-directory: frontend
      - name: Typecheck
        run: bun run typecheck
        working-directory: frontend
      - name: Unit tests
        run: bun run test
        working-directory: frontend
      - name: Production build
        # tsc passes on a missing asset import (module declaration) and vitest
        # mocks it; only `vite build` catches unresolvable imports, CSS/plugin
        # errors and the like. docker.yml would find them after merge, and not
        # at all for fork PRs -- so run the real build here.
        run: bun run build
        working-directory: frontend

  tr-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-tr-auth:test services/tr-auth
      - name: Run helper and HTTP contract tests
        run: >-
          docker run --rm
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/tr-auth/test_main.py:/tests/test_main.py:ro"
          --workdir /tests
          picsou-tr-auth:test
          python -m unittest discover -v

  bourse-direct-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-bourse-direct-auth:test services/bourse-direct-auth
      - name: Run parser, lifecycle, and browser navigation tests
        run: >-
          docker run --rm --ipc=host
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_navigation.py:/tests/test_navigation.py:ro"
          --volume "${{ github.workspace }}/services/bourse-direct-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --workdir /tests
          picsou-bourse-direct-auth:test
          python -m unittest discover -v

  bourso-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the browserless sidecar image
        run: docker build --tag picsou-bourso-auth:test services/bourso-auth
      - name: Run parser, contract and lifecycle tests
        run: >-
          docker run --rm
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/bourso-auth/fixtures.py:/tests/fixtures.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_virtual_pad.py:/tests/test_virtual_pad.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_accounts_parser.py:/tests/test_accounts_parser.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/bourso-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --workdir /tests
          picsou-bourso-auth:test
          python -m unittest discover -v

  amundi-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the Chromium-only sidecar image
        run: docker build --tag picsou-amundi-auth:test services/amundi-auth
      - name: Run parser and lifecycle tests
        run: >-
          docker run --rm --ipc=host
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/amundi-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/amundi-auth/test_lifecycle.py:/tests/test_lifecycle.py:ro"
          --workdir /tests
          picsou-amundi-auth:test
          python -m unittest discover -v

  degiro-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the browserless sidecar image
        run: docker build --tag picsou-degiro-auth:test services/degiro-auth
      - name: Run parser and contract tests
        run: >-
          docker run --rm
          --env PYTHONPATH=/app
          --volume "${{ github.workspace }}/services/degiro-auth/test_main.py:/tests/test_main.py:ro"
          --volume "${{ github.workspace }}/services/degiro-auth/test_portfolio_parser.py:/tests/test_portfolio_parser.py:ro"
          --workdir /tests
          picsou-degiro-auth:test
          python -m unittest discover -v
