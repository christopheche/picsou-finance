services:
  app:
    # Pre-built image published to GHCR by .github/workflows/docker.yml.
    # `docker compose pull` fetches it; `docker compose up --build` rebuilds
    # from source instead (for contributors).
    image: ghcr.io/zoeille/picsou-finance:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      # Plain HTTP, published on both IPv4 and IPv6 (the unqualified short form
      # binds 0.0.0.0 *and* [::]; naming an explicit host IP would bind one
      # family only and silently cut off IPv6 clients).
      #
      # Running the `tls` profile and want this port closed on the LAN so Caddy
      # is the only way in? Add the override file, which removes this publish:
      #   docker compose -f docker/docker-compose.yml \
      #                  -f docker/docker-compose.no-http.yml \
      #                  --profile tls up -d
      # Compose cannot vary `ports` by profile, and an env-var host prefix was
      # tried and reverted: a value missing its trailing colon expanded to
      # `127.0.0.18080:8080` and aborted the whole stack with an opaque
      # "invalid published port".
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      # /data holds the auto-generated JWT/crypto secrets and the Enable
      # Banking key pair the setup wizard generates (/data/keys). Mounted
      # named volume so they persist across container replacement.
      # No bind mount for a hand-made Enable Banking key: the wizard generates
      # the pair and stores it on this volume; to bring your own key instead,
      # set ENABLEBANKING_PRIVATE_KEY (inline PEM) in docker/.env.
      - picsou_data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-picsou}?sslmode=prefer
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-picsou}
      # Same expression as the db service's POSTGRES_PASSWORD below, so the
      # two sides always agree — both interpolate from docker/.env. Spring
      # only reads SPRING_DATASOURCE_PASSWORD (application.yml); it never
      # looks at POSTGRES_PASSWORD, which is why this line must exist.
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-picsou}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Wall-clock zone for the JVM: the scheduled jobs (daily sync at 08:00,
      # monthly snapshot on the 1st at 03:30) and day boundaries follow it.
      # eclipse-temurin defaults to UTC when unset. Set TZ in docker/.env.
      TZ: ${TZ:-UTC}
      TR_AUTH_URL: http://tr-auth:8001
      BOURSO_AUTH_URL: http://bourso-auth:8001
      BOURSE_DIRECT_AUTH_URL: http://bourse-direct-auth:8001
      AMUNDI_AUTH_URL: http://amundi-auth:8001
      DEGIRO_AUTH_URL: http://degiro-auth:8001
    # Mirrors the Dockerfile HEALTHCHECK so it also applies to images built
    # before it existed. Probes through nginx: a backend that cannot start
    # (bad DB password, Flyway failure, DB not ready) crash-loops under
    # supervisord while nginx answers 502 and `docker compose ps` would
    # otherwise show a healthy-looking "Up" forever.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      # Wait for Postgres to accept connections rather than for the container
      # to exist — otherwise the first boot on a slow host races HikariPool
      # against initdb and the backend dies before the db is ready.
      db:
        condition: service_healthy
      tr-auth:
        condition: service_started
      bourso-auth:
        condition: service_started
      bourse-direct-auth:
        condition: service_started
      amundi-auth:
        condition: service_started
      degiro-auth:
        condition: service_started

  # Optional TLS terminator — OFF unless the `tls` profile is requested:
  #   docker compose -f docker/docker-compose.yml --profile tls up -d
  # Left opt-in so it cannot collide with an ingress proxy the operator
  # already runs (Traefik, Nginx Proxy Manager, …) over :80/:443.
  # Certificate strategy is chosen by Caddy from PICSOU_DOMAIN — see Caddyfile.
  proxy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"       # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3 — Caddy advertises h3 via Alt-Svc by default,
                      # so without the UDP map browsers retry and fall back.
    environment:
      # Interpolated from docker/.env (Compose's project directory). Drives the
      # Caddyfile's site address, which is what selects ACME vs internal CA.
      PICSOU_DOMAIN: ${PICSOU_DOMAIN:-picsou.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds issued certificates AND the internal CA root key.
      # It must persist: losing it regenerates the root, invalidating the
      # certificate every device was told to trust.
      - caddy_data:/data
      - caddy_config:/config
    # Without this, `--profile tls up -d` reports success even when Caddy has
    # exited — e.g. a PICSOU_DOMAIN that cannot be a certificate subject makes
    # it abort at config-adapt time, and with `restart: unless-stopped` that
    # becomes a restart loop the operator never sees. Probes Caddy's admin API,
    # which only answers once the config has been loaded and the site is up.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - app

  tr-auth:
    image: ghcr.io/zoeille/picsou-finance/tr-auth:latest
    build:
      context: ../services/tr-auth
      dockerfile: Dockerfile
    restart: unless-stopped

  bourso-auth:
    image: ghcr.io/zoeille/picsou-finance/bourso-auth:latest
    build:
      context: ../services/bourso-auth
      dockerfile: Dockerfile
    restart: unless-stopped

  bourse-direct-auth:
    image: ghcr.io/zoeille/picsou-finance/bourse-direct-auth:latest
    build:
      context: ../services/bourse-direct-auth
      dockerfile: Dockerfile
    restart: unless-stopped

  amundi-auth:
    image: ghcr.io/zoeille/picsou-finance/amundi-auth:latest
    build:
      context: ../services/amundi-auth
      dockerfile: Dockerfile
    restart: unless-stopped

  degiro-auth:
    image: ghcr.io/zoeille/picsou-finance/degiro-auth:latest
    build:
      context: ../services/degiro-auth
      dockerfile: Dockerfile
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picsou}
      POSTGRES_USER: ${POSTGRES_USER:-picsou}
      # User-supplied POSTGRES_PASSWORD from docker/.env, else the literal
      # 'picsou'. Postgres only initialises the role on a FRESH volume, so set
      # it before the first `up` (README §4); changing it later requires
      # ALTER ROLE inside the db. The port is not published — the default is
      # reachable only on the Compose network. The app service derives its
      # SPRING_DATASOURCE_PASSWORD from the very same expression.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picsou}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picsou} -d ${POSTGRES_DB:-picsou}"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
  picsou_data:
  caddy_data:
  caddy_config:
